name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest
      - name: SDK validation
        run: |
          python -c "import asyncio, agent_core; report = asyncio.run(agent_core.run_agent_core_validation(metadata={'ci': 'github-actions'})); raise SystemExit(0 if report.ready else 1)"
